<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="lotusGoldWash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#e0728c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#e26685" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#aa771c" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Central Ambient Wash -->
  <circle cx="160" cy="160" r="145" fill="url(#lotusGoldWash)"/>

  <!-- Sacred Geometric Lotus Rosette -->
  <g transform="translate(160, 160)" stroke="url(#petalStroke)" stroke-width="1.2" fill="none">
    <!-- Outer Concentric Rings -->
    <circle cx="0" cy="0" r="140" stroke-dasharray="4,6" opacity="0.6"/>
    <circle cx="0" cy="0" r="115" stroke-dasharray="2,4" opacity="0.4"/>
    <circle cx="0" cy="0" r="70" opacity="0.5"/>
    <circle cx="0" cy="0" r="28" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="12" fill="url(#lotusGoldWash)"/>

    <!-- 16 Sacred Lotus Petals (Rotated at 22.5 deg intervals) -->
    <!-- Layer 1: Outer Petals -->
    <path d="M 0 -28 C 30 -60, 42 -105, 0 -138 C -42 -105, -30 -60, 0 -28 Z"/>
    <path d="M 0 -28 C 30 -60, 42 -105, 0 -138 C -42 -105, -30 -60, 0 -28 Z" transform="rotate(45)"/>
    <path d="M 0 -28 C 30 -60, 42 -105, 0 -138 C -42 -105, -30 -60, 0 -28 Z" transform="rotate(90)"/>
    <path d="M 0 -28 C 30 -60, 42 -105, 0 -138 C -42 -105, -30 -60, 0 -28 Z" transform="rotate(135)"/>
    <path d="M 0 -28 C 30 -60, 42 -105, 0 -138 C -42 -105, -30 -60, 0 -28 Z" transform="rotate(180)"/>
    <path d="M 0 -28 C 30 -60, 42 -105, 0 -138 C -42 -105, -30 -60, 0 -28 Z" transform="rotate(225)"/>
    <path d="M 0 -28 C 30 -60, 42 -105, 0 -138 C -42 -105, -30 -60, 0 -28 Z" transform="rotate(270)"/>
    <path d="M 0 -28 C 30 -60, 42 -105, 0 -138 C -42 -105, -30 -60, 0 -28 Z" transform="rotate(315)"/>

    <!-- Layer 2: Interstitial Petals (Rotated by 22.5 deg) -->
    <path d="M 0 -28 C 24 -55, 34 -90, 0 -120 C -34 -90, -24 -55, 0 -28 Z" transform="rotate(22.5)" stroke-width="0.9" opacity="0.75"/>
    <path d="M 0 -28 C 24 -55, 34 -90, 0 -120 C -34 -90, -24 -55, 0 -28 Z" transform="rotate(67.5)" stroke-width="0.9" opacity="0.75"/>
    <path d="M 0 -28 C 24 -55, 34 -90, 0 -120 C -34 -90, -24 -55, 0 -28 Z" transform="rotate(112.5)" stroke-width="0.9" opacity="0.75"/>
    <path d="M 0 -28 C 24 -55, 34 -90, 0 -120 C -34 -90, -24 -55, 0 -28 Z" transform="rotate(157.5)" stroke-width="0.9" opacity="0.75"/>
    <path d="M 0 -28 C 24 -55, 34 -90, 0 -120 C -34 -90, -24 -55, 0 -28 Z" transform="rotate(202.5)" stroke-width="0.9" opacity="0.75"/>
    <path d="M 0 -28 C 24 -55, 34 -90, 0 -120 C -34 -90, -24 -55, 0 -28 Z" transform="rotate(247.5)" stroke-width="0.9" opacity="0.75"/>
    <path d="M 0 -28 C 24 -55, 34 -90, 0 -120 C -34 -90, -24 -55, 0 -28 Z" transform="rotate(292.5)" stroke-width="0.9" opacity="0.75"/>
    <path d="M 0 -28 C 24 -55, 34 -90, 0 -120 C -34 -90, -24 -55, 0 -28 Z" transform="rotate(337.5)" stroke-width="0.9" opacity="0.75"/>
  </g>
</svg>
